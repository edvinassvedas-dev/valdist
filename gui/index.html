<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>valdist viewer</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1a1a1a; --muted: #666; --line: #e0e0e0;
    --panel: #f7f7f8; --accent: #2b6cb0; --ok: #1a7f43; --warn: #b45309;
    --err: #c0392b; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --fg: #e6e6e6; --muted: #9aa0a6; --line: #2c3038;
      --panel: #1b1e24; --accent: #6ba3e0; --ok: #4ade80; --warn: #fbbf24;
      --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  /* Background on html as well as body: body is a fixed-height grid, so any
     viewport taller than it would otherwise show the browser's default white
     through underneath - very visible in dark mode. */
  html { height: 100%; background: var(--bg); }
  body {
    margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: grid; grid-template-columns: 260px 1fr;
  }
  aside {
    border-right: 1px solid var(--line); overflow-y: auto; padding: 14px;
    background: var(--panel);
  }
  aside h1 { font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
             color: var(--muted); margin: 0 0 4px; }
  aside .sub { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  /* The filter sits above #list and outside it, so redrawing the list on every
     keystroke cannot take the focus or the caret out of the field being typed
     into. */
  #search {
    font: inherit; font-family: var(--mono); font-size: 13px; width: 100%;
    padding: 6px 9px; margin-bottom: 10px; border-radius: 6px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  }
  #search:focus { outline: none; border-color: var(--accent); }
  #search::-webkit-search-cancel-button { filter: grayscale(1); }
  .list-hint { font-size: 12px; color: var(--muted); font-family: var(--mono);
               padding: 0 9px; margin: 2px 0 6px; }
  .list-none { font-size: 12px; color: var(--muted); padding: 6px 9px; }
  .list-none b { color: var(--fg); font-family: var(--mono); font-weight: 500;
                 word-break: break-all; }
  .item {
    padding: 7px 9px; border-radius: 6px; cursor: pointer; font-family: var(--mono);
    font-size: 13px; border: 1px solid transparent;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
  }
  /* Age sits at the trailing edge, muted, so scanning the list still reads as a
     column of names. Stale takes the same colour the portfolio's age column
     takes, because it is the same statement about the same row. */
  .age { font-size: 11px; color: var(--muted); flex: none; }
  .age.stale { color: var(--viz-neg); }
  .item > .age { margin-left: auto; }
  .item > .pick { flex: none; margin: 0; align-self: center; cursor: pointer; }
  .item.active .age { color: inherit; }
  .list-tools { display: flex; gap: 6px; margin: 6px 0 10px; }
  .list-tools button {
    font: inherit; font-size: 11px; font-family: var(--mono); cursor: pointer;
    padding: 3px 8px; border-radius: 5px; background: var(--bg); color: var(--muted);
    border: 1px solid var(--line);
  }
  .list-tools button.on { color: var(--accent); border-color: var(--accent); }
  .list-group {
    display: flex; justify-content: space-between; font-family: var(--mono);
    font-size: 11px; color: var(--muted); padding: 8px 9px 3px;
    border-top: 1px solid var(--line); margin-top: 6px;
  }
  .list-group:first-of-type { border-top: none; margin-top: 0; }
  /* Flags: one badge per thing the row has to declare. Muted by default so a
     "no quote" note does not shout; warn/bad carry the floored-draw and
     degenerate-result cases. */
  td.flags { white-space: normal; }
  .badge {
    display: inline-block; font-family: var(--mono); font-size: 11px;
    padding: 1px 6px; margin: 1px 3px 1px 0; border-radius: 4px;
    background: var(--bg); color: var(--muted); border: 1px solid var(--line);
  }
  .badge.warn { color: var(--viz-neg); border-color: var(--viz-neg); }
  .badge.bad { color: #fff; background: var(--viz-neg); border-color: var(--viz-neg); }
  .item:hover { background: var(--bg); }
  .item.active { background: var(--bg); border-color: var(--accent); color: var(--accent); }
  main { overflow-y: auto; padding: 22px 26px; min-width: 0; }
  /* Width caps, layered. Without them `table { width: 100% }` stretched a
     two-column stat table across a 1920px screen, leaving ~1570px of dead
     space between "P10" and its value, and made every tornado bar ~880px so
     they all read as maxed out and stopped comparing anything.
       --content : the reading column, matching the report tab's own measure.
       --stats   : key/value pairs - short strings, must stay scannable.
       --tornado : wide enough for the bars to differ visibly, no wider. */
  :root { --content: 1080px; --stats: 440px; --tornado: 680px; }
  main > * { max-width: var(--content); }
  .stats { max-width: var(--stats); }
  .tornado-t { max-width: var(--tornado); }
  /* Genuinely wide content (worlds' 8 columns, markdown tables, the raw text
     block) keeps the full content width and scrolls inside itself rather than
     forcing the page to scroll sideways. */
  .scroll { max-width: var(--content); }
  .empty { color: var(--muted); margin-top: 40vh; text-align: center; }
  h2 { margin: 0 0 2px; font-size: 20px; font-family: var(--mono); }
  .tagline { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .price-box { display: flex; align-items: center; gap: 7px; margin-right: 4px;
               padding-right: 12px; border-right: 1px solid var(--line); }
  .price-box label { font-size: 12px; color: var(--muted); }
  .price-box input {
    font: inherit; font-family: var(--mono); font-size: 13px; width: 8.5ch;
    padding: 5px 7px; text-align: right; border-radius: 6px;
    background: var(--bg); color: var(--fg); border: 1px solid var(--line);
  }
  .price-box input:focus { outline: none; border-color: var(--accent); }
  .price-box .hint { font-size: 12px; color: var(--muted); font-family: var(--mono); }
  .whatif { color: var(--warn); border-color: var(--warn);
            background: color-mix(in srgb, var(--warn) 10%, transparent); }
  tr.centre td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  td.tag { color: var(--muted); font-size: 12px; }
  button {
    font: inherit; font-size: 13px; padding: 6px 13px; cursor: pointer;
    background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
  }
  button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .5; cursor: progress; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
  .tab {
    padding: 7px 13px; cursor: pointer; font-size: 13px; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  pre {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; overflow-x: auto; font-family: var(--mono); font-size: 12.5px;
    line-height: 1.5; white-space: pre; margin: 0;
  }
  .md { max-width: 78ch; }
  .md h1 { font-size: 21px; margin: 0 0 12px; }
  .md h2 { font-size: 17px; margin: 26px 0 9px; padding-bottom: 5px;
           border-bottom: 1px solid var(--line); }
  .md h3 { font-size: 15px; margin: 20px 0 7px; }
  .md p { margin: 0 0 11px; }
  .md ul { margin: 0 0 11px; padding-left: 20px; }
  .md li { margin-bottom: 4px; }
  .md code { font-family: var(--mono); font-size: 12.5px; background: var(--panel);
             padding: 1px 5px; border-radius: 4px; }
  .md pre code { background: none; padding: 0; }
  .md table { margin: 0 0 14px; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .md blockquote { margin: 0 0 11px; padding-left: 12px; border-left: 3px solid var(--line);
                   color: var(--muted); }
  /* Capped with the tornado rather than the content column: a banner floating
     at 1080px above a 440px stat table reads as two unrelated blocks. Long
     validation digests simply wrap, which is easier to read than one very
     long line anyway. */
  .banner { border-radius: 8px; padding: 10px 13px; margin-bottom: 12px; font-size: 13px;
            border: 1px solid; max-width: var(--tornado); }
  .banner.ok   { color: var(--ok);   border-color: var(--ok);   background: color-mix(in srgb, var(--ok) 8%, transparent); }
  .banner.warn { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .banner.err  { color: var(--err);  border-color: var(--err);  background: color-mix(in srgb, var(--err) 8%, transparent); }
  .banner b { display: block; margin-bottom: 3px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase;
       letter-spacing: .04em; }
  td.num { text-align: right; font-family: var(--mono); }
  /* ---- data-viz roles -------------------------------------------------
     Diverging pair blue<->red with a neutral gray midpoint. Both modes are
     selected, not flipped, and both were run through the palette validator
     against this page's own surfaces (#ffffff / #14161a): all six checks pass
     in each. The previous ad-hoc bar blue #6ba3e0 failed the dark lightness
     band (L 0.702 against 0.48-0.67), which is why these are stepped values
     rather than one hue reused. */
  :root {
    --viz-pos: #2a78d6; --viz-neg: #e34948;
    --viz-track: #eceae5; --viz-axis: #c3c2b7; --viz-band: rgba(42,120,214,0.22);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --viz-pos: #3987e5; --viz-neg: #e66767;
      --viz-track: #26262b; --viz-axis: #3a3a40; --viz-band: rgba(57,135,229,0.28);
    }
  }

  /* Hero: the one number the view leads with. Proportional figures, system
     sans - tabular-nums would make a value like 0.4272 look loose this large. */
  .hero { margin: 4px 0 22px; }
  .hero .lab { font-size: 12px; letter-spacing: .05em; text-transform: uppercase;
               color: var(--muted); margin-bottom: 2px; }
  .hero .val { font-size: 52px; line-height: 1.05; font-weight: 600; letter-spacing: -0.02em; }
  .hero .sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

  .viz { margin: 0 0 24px; max-width: var(--tornado); }
  .viz-head { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .viz-sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-bottom: 12px; }

  /* Value-range strip: P10-P90 band, P50 tick, price marker. */
  .strip { position: relative; padding: 26px 34px 30px; }
  .strip-track { position: relative; height: 14px; border-radius: 7px;
                 background: var(--viz-track); }
  .strip-band { position: absolute; top: 0; height: 14px; border-radius: 7px;
                background: var(--viz-band);
                box-shadow: inset 0 0 0 1.5px var(--viz-pos); }
  /* P50 is a 2px surface-coloured notch, not a blue line: a blue tick on a blue
     band has almost no contrast, and the surface gap is the documented way to
     separate touching marks. It also reads correctly - the median splits the
     band's mass in half. */
  .strip-p50 { position: absolute; top: 0; width: 2px; height: 14px;
               background: var(--bg); }
  /* P25 is the conservative value anchor, so it is marked on the band but gets
     no text tick: a fourth label between P10 and P50 collides on a tight
     distribution (they are translateX(-50%) and P25/P50 can sit a few percent
     apart). It reads as a 1px surface hairline - present, subordinate to the
     median notch, and named in the track tooltip and the sub-heading. */
  .strip-p25 { position: absolute; top: 3px; width: 1px; height: 8px;
               background: var(--bg); opacity: 0.75; }
  /* The price is a reference, not a series, so it wears ink rather than a data
     hue - and sits above the track so its label cannot collide with the
     P10/P50/P90 labels below. */
  .strip-price { position: absolute; top: 8px; bottom: 22px; width: 2px;
                 background: var(--fg); border-radius: 1px; }
  .strip-price::after { content: ""; position: absolute; left: -3px; bottom: -1px;
                        border: 4px solid transparent; border-top-color: var(--fg); }
  .strip-price-lab { position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
                     white-space: nowrap; font-size: 12px; font-family: var(--mono); }
  .strip-tick { position: absolute; bottom: 8px; transform: translateX(-50%);
                white-space: nowrap; font-size: 12px; font-family: var(--mono);
                color: var(--muted); }
  .strip-tick b { color: var(--fg); font-weight: 600; }

  /* Diverging bars, centred on zero: sign is carried by side AND by hue AND by
     the signed label, so colour is never the only channel. */
  .dv { display: grid; grid-template-columns: 13ch 1fr 8ch; align-items: center;
        gap: 4px 10px; font-size: 13px; }
  /* Four columns when a row carries a note (the tornado's swing); three
     otherwise, which is what the margin-of-safety chart still uses. */
  .dv.dv-noted { grid-template-columns: 13ch 1fr 6ch minmax(0, 1.15fr); }
  .sw { display: grid; grid-template-columns: 1fr 6ch auto; align-items: center;
        gap: 6px; padding-left: 10px; }
  .sw-track { position: relative; height: 6px; background: var(--line);
              border-radius: 3px; overflow: hidden; }
  .sw-bar { position: absolute; left: 0; top: 0; bottom: 0; display: block;
            background: var(--muted); }
  .sw-val { text-align: right; font-family: var(--mono); font-size: 12px; }
  .sw-band { font-family: var(--mono); font-size: 11px; color: var(--muted);
             white-space: nowrap; }
  /* The stated band is not the band the swing was measured across. */
  .sw-drift { color: var(--warn); }
  .dv-name { color: var(--fg); }
  .dv-track { position: relative; height: 18px; }
  .dv-zero { position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px;
             background: var(--viz-axis); }
  .dv-bar { position: absolute; top: 3px; height: 12px; }
  .dv-bar.pos { background: var(--viz-pos); border-radius: 0 4px 4px 0; }
  .dv-bar.neg { background: var(--viz-neg); border-radius: 4px 0 0 4px; }
  .dv-val { text-align: right; font-family: var(--mono); font-size: 12.5px;
            font-variant-numeric: tabular-nums; }

  /* Meter for a 0-1 ratio (p_undervalued). Track is a receded step of the
     fill's own hue, not gray, so state reads across the whole bar. The 0.5
     hairline is the only threshold that means anything here - the coin flip. */
  .meter { position: relative; height: 10px; border-radius: 5px;
           background: color-mix(in srgb, var(--viz-pos) 16%, transparent); min-width: 90px; }
  .meter > i { position: absolute; left: 0; top: 0; height: 10px;
               border-radius: 5px; background: var(--viz-pos); }
  .meter > u { position: absolute; left: 50%; top: -2px; height: 14px; width: 1px;
               background: var(--viz-axis); }

  /* Marginals: one row per driver, each on its own axis. The deliberate
     opposite of the timeline above, and the same reasoning as the worlds view:
     `cap_rate` runs 5-7 and `nav_other` runs 1875-4730, so one shared axis
     would collapse every narrow band to a hairline against the widest driver.
     The trade is that widths are not comparable between rows, which is why the
     numbers sit beside every strip rather than only in a tooltip. */
  .mg-row { display: grid; grid-template-columns: 15ch 1fr; gap: 2px 12px;
            align-items: start; padding: 9px 0; border-top: 1px solid var(--line); }
  .mg-name { font-family: var(--mono); font-size: 12.5px; }
  .mg-fam { display: block; font-size: 11px; color: var(--muted); }
  .mg-track { position: relative; height: 26px; }
  /* Stated is the analyst's claim, so it wears ink; realized is what the engine
     draws, so it wears the data hue. Where they coincide the second sits on top
     of the first and the row reads as one band, which is the correct picture. */
  .mg-stated { position: absolute; top: 3px; height: 7px; border-radius: 4px;
               background: color-mix(in srgb, var(--fg) 22%, transparent); }
  .mg-realized { position: absolute; top: 13px; height: 7px; border-radius: 4px;
                 background: color-mix(in srgb, var(--accent) 45%, transparent); }
  .mg-mid { position: absolute; top: 1px; height: 11px; width: 2px; background: var(--fg); }
  .mg-rmid { position: absolute; top: 11px; height: 11px; width: 2px; background: var(--accent); }
  .mg-nums { grid-column: 2; font-family: var(--mono); font-size: 11.5px;
             color: var(--muted); font-variant-numeric: tabular-nums; }
  .mg-nums b { color: var(--fg); font-weight: 600; }
  .mg-badge { font-size: 11px; padding: 1px 5px; border-radius: 3px;
              background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
  .mg-drift-hi { color: var(--warn); font-weight: 600; }

  /* Loadings matrix. Same three channels as .dv - side, hue AND signed label -
     shrunk to fit a table cell, because a grid of colour-only cells is a
     heatmap, and a heatmap is the one chart that hides sign from anyone who
     reads it in grayscale. Λ is judgment on display, so every cell has
     to be legible as a number, not merely as a shade. */
  .lam-cell { position: relative; height: 12px; min-width: 74px; }
  .lam-zero { position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px;
              background: var(--viz-axis); }
  .lam-bar { position: absolute; top: 1px; height: 10px; }
  .lam-pos { background: var(--viz-pos); border-radius: 0 3px 3px 0; }
  .lam-neg { background: var(--viz-neg); border-radius: 3px 0 0 3px; }
  /* An explicit zero gets a visible dot rather than an empty cell: "this factor
     does not move this driver" is a claim somebody made, and a blank cell reads
     as "not rendered". */
  .lam-nil { position: absolute; left: 50%; top: 5px; width: 3px; height: 3px;
             margin-left: -1px; border-radius: 50%; background: var(--viz-axis); }
  .lam-val { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums;
             color: var(--muted); }
  .lam-row-full td { background: color-mix(in srgb, var(--warn) 9%, transparent); }

  /* Ticker timeline: one strip per run, stacked chronologically, on one shared
     axis. The sharing is the whole point and the opposite of the worlds view
     below, which splits axes because its drivers have incompatible scales.
     Here every strip is the same company in the same units, so a per-strip axis
     would rescale each band to its own extent and draw two different views
     identically - a picture that cannot show the drift it exists to show. */
  .tl-row { display: grid; grid-template-columns: 11ch 1fr; gap: 2px 12px;
            align-items: start; margin-bottom: 16px; }
  .tl-date { font-family: var(--mono); font-size: 12.5px; padding-top: 2px; }
  .tl-strip { position: relative; height: 30px; }
  .tl-track { position: absolute; left: 0; right: 0; top: 8px; height: 12px; }
  .tl-band { position: absolute; top: 0; height: 12px; border-radius: 6px;
             background: color-mix(in srgb, var(--accent) 30%, transparent); }
  .tl-p50 { position: absolute; top: -1px; height: 14px; width: 2px; background: var(--bg); }
  .tl-p25 { position: absolute; top: 1px; height: 10px; width: 1px; background: var(--viz-axis); }
  .tl-price { position: absolute; top: 2px; bottom: 4px; width: 2px; background: var(--fg); }
  .tl-price::after { content: ""; position: absolute; left: -3px; bottom: -1px;
                     border-left: 4px solid transparent; border-right: 4px solid transparent;
                     border-bottom: 5px solid var(--fg); }
  .tl-nums { font-family: var(--mono); font-size: 12px; color: var(--muted);
             font-variant-numeric: tabular-nums; grid-column: 2; }
  .tl-nums b { color: var(--fg); font-weight: 600; }
  .tl-axis { grid-column: 2; border-top: 1px solid var(--line); font-family: var(--mono);
             font-size: 11.5px; color: var(--muted); display: flex;
             justify-content: space-between; padding-top: 3px; margin-bottom: 14px; }

  /* Worlds: small multiples, one driver per row on its own axis. The drivers
     have incompatible scales (cost_of_equity 8-10 vs div_growth -0.4-3.8), so
     a shared axis would be the dual-axis mistake. Ordinal ramp - one hue, three
     steps - because the three worlds are ordered (P10 < P50 < P90), not nominal. */
  /* Ordinal ramp, validated with --ordinal against each surface. The light-mode
     light end is step 250, not the lighter step 200: #9ec5f4 measures 1.79:1 on
     white, under the 2:1 floor, so the P10 dot would have been near-invisible. */
  :root { --w10: #86b6ef; --w50: #3987e5; --w90: #184f95; }
  @media (prefers-color-scheme: dark) {
    :root { --w10: #86b6ef; --w50: #3987e5; --w90: #1c5cab; }
  }
  .wr { display: grid; grid-template-columns: 15ch 1fr; gap: 3px 12px;
        align-items: center; margin-bottom: 15px; }
  .wr-name { font-size: 13px; font-family: var(--mono); }
  .wr-sub { grid-column: 2; font-size: 11.5px; color: var(--muted); margin-top: -2px; }
  .wr-axis { position: relative; height: 26px; }
  /* The stated p10-p90 band, as context for "is this draw ordinary?" */
  .wr-band { position: absolute; top: 9px; height: 8px; border-radius: 4px;
             background: color-mix(in srgb, var(--viz-pos) 26%, transparent); }
  .wr-p50 { position: absolute; top: 6px; width: 1px; height: 14px; background: var(--viz-axis); }
  .wr-rule { position: absolute; top: 12.5px; left: 0; right: 0; height: 1px;
             background: var(--viz-axis); }
  /* 2px surface ring so overlapping dots stay legible where worlds coincide. */
  .wr-dot { position: absolute; top: 7px; width: 12px; height: 12px; border-radius: 50%;
            margin-left: -6px; box-shadow: 0 0 0 2px var(--bg); }
  /* A draw outside the stated band gets a warning ring, not a text label. The
     label version overprinted the caption line beneath it on three of six rows;
     the caption already says "a draw falls outside the stated band" in words, so
     the ring is a second channel rather than the only one. */
  .wr-dot.out { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--warn); }
  .wr-legend { display: flex; gap: 14px; align-items: center; font-size: 12px;
               color: var(--muted); margin: 2px 0 16px; }
  .wr-key { width: 11px; height: 11px; border-radius: 50%; display: inline-block;
            vertical-align: -1px; margin-right: 5px; }

  /* Histogram of the 50,000 draws. Split at the price: mass to the right of it
     is p_undervalued, so the split makes the hero number visible rather than
     merely stated. */
  /* Top padding is headroom for the price label, which sits above the plot so
     it cannot collide with the percentile labels below it. */
  .hist-wrap { position: relative; padding: 20px 0; }
  .hist { display: flex; align-items: flex-end; gap: 1px; height: 120px; }
  .hist > i { flex: 1 1 0; min-height: 1px; background: var(--viz-pos);
              border-radius: 2px 2px 0 0; }
  .hist > i.over { background: var(--viz-neg); }
  .hist-price { position: absolute; top: 20px; bottom: 20px; width: 2px;
                background: var(--fg); }
  .hist-price::after { content: ""; position: absolute; left: -3px; bottom: -1px;
                       border: 4px solid transparent; border-top-color: var(--fg); }
  .hist-price-lab { position: absolute; top: -17px; left: 50%; transform: translateX(-50%);
                    white-space: nowrap; font-size: 11.5px; font-family: var(--mono); }
  /* Percentile references: recessive solid hairlines, never dashed. They are
     chrome, not data - the price line stays ink so it still reads as the one
     marker that matters. Labels are the percentile name only; the values sit in
     the range strip directly above, and repeating them here would both clutter
     the axis and collide with the price label. */
  .hist-q { position: absolute; top: 20px; bottom: 20px; width: 1px;
            background: var(--viz-axis); }
  .hist-q > b { position: absolute; bottom: -19px; left: 50%; transform: translateX(-50%);
                font-size: 11px; font-weight: 500; color: var(--muted);
                font-family: var(--mono); }
  .hist-ax { position: absolute; bottom: 0; left: 0; right: 0; height: 18px;
             font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
  .hist-ax span { position: absolute; white-space: nowrap; opacity: .75; }
  .hist-tail { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  /* Portfolio */
  .mos-pick { display: flex; align-items: center; gap: 7px; margin: 0 0 14px;
              font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .mos-pick button { padding: 4px 12px; font-size: 12.5px; }
  .mos-pick button.on { border-color: var(--accent); color: var(--accent);
                        background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .mos-pick .tag { font-size: 12px; }
  /* The filter sits at the top of the column, centred, because it governs
     everything below it rather than any one control. */
  .pf-filter { display: flex; justify-content: center; margin: 0 0 10px; }
  .pf-filter input {
    width: 100%; text-align: center; padding: 7px 12px;
    border-radius: 7px; border: 1px solid var(--line); background: var(--bg);
    color: var(--fg); font-family: var(--mono); font-size: 13px;
  }
  .pf-filter input:focus { outline: none; border-color: var(--accent); }
  .pf-sel { display: flex; align-items: center; justify-content: center; gap: 7px;
            flex-wrap: wrap; margin: 0 0 14px; font-size: 13px; color: var(--muted); }
  .pf-sel button { padding: 4px 12px; font-size: 12.5px; }
  .pf-sel button.on { border-color: var(--accent); color: var(--accent);
                      background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .pf-sel .tag { font-size: 12px; }
  .pf-chip { font-family: var(--mono); font-size: 12px; }
  .pf-none { font-size: 13px; color: var(--muted); text-align: center;
             padding: 18px 9px; }
  .pf-none b { color: var(--fg); font-family: var(--mono); font-weight: 500;
               word-break: break-all; }
  /* The dropdown floats over the table rather than pushing it down, so the
     rows a reader is choosing between do not move while they choose. */
  .pf-box { position: relative; width: min(460px, 100%); }
  .pf-suggest { position: absolute; top: calc(100% + 4px); left: 0; right: 0;
                z-index: 20; background: var(--panel); border: 1px solid var(--line);
                border-radius: 7px; overflow: hidden; text-align: left;
                box-shadow: 0 6px 20px rgba(0, 0, 0, .18); }
  .pf-suggest-item { padding: 7px 11px; cursor: pointer; font-family: var(--mono);
                     font-size: 13px; }
  .pf-suggest-item:hover { background: color-mix(in srgb, var(--accent) 14%, transparent);
                           color: var(--accent); }
  .pf-suggest-none, .pf-suggest-more { padding: 7px 11px; font-size: 12px;
                                       color: var(--muted); }
  .pf-suggest-none b { color: var(--fg); font-family: var(--mono); font-weight: 500;
                       word-break: break-all; }
  .pf-row { cursor: pointer; }
  .pf-row:hover td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .pf-bar { position: relative; height: 9px; border-radius: 5px;
            background: color-mix(in srgb, var(--viz-pos) 16%, transparent); min-width: 70px; }
  .pf-bar > i { position: absolute; left: 0; top: 0; height: 9px; border-radius: 5px;
                background: var(--viz-pos); }
  .pf-bar > u { position: absolute; left: 50%; top: -2px; height: 13px; width: 1px;
                background: var(--viz-axis); }

  /* Compare */
  .cmp-sel { display: flex; align-items: center; gap: 7px; margin: 0 0 14px; }
  .cmp-sel select { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px;
                    background: var(--bg); color: var(--fg); border: 1px solid var(--line); }
  td.up { color: var(--viz-pos); } td.down { color: var(--viz-neg); }
  td.same { color: var(--muted); }
  .scroll { overflow-x: auto; }
  footer { color: var(--muted); font-size: 12px; margin-top: 26px;
           border-top: 1px solid var(--line); padding-top: 10px; }
</style>
</head>
<body>
<aside>
  <h1>valdist</h1>
  <div class="sub">read-only viewer</div>
  <input id="search" type="search" placeholder="Filter: ticker or date"
         autocomplete="off" spellcheck="false" aria-label="Filter analyses">
  <div id="list"></div>
</aside>
<main id="main"><div class="empty">Select an analysis</div></main>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const fmt = n => (typeof n === "number" && isFinite(n)) ? n.toFixed(2) : String(n ?? "-");

let current = null, tab = "report", cache = {}, busy = null, priceOverride = null;
let allNames = [], compareWith = "";
// `current` is null both before anything is opened and while the portfolio is
// showing, so it cannot double as the sidebar's selection marker.
const PORTFOLIO = "@all";
let selected = null;
let groupByTicker = false;
let drawList = () => {};
// P10 by default: a name can look healthy on the median and still carry a severe
// downside (A54: P50 +72.6%, P10 -47.6%). Shared with the price ladder.
// `repriced` starts null, a third value meaning "server, choose": only the server
// knows whether `prices.json` holds any quotes. The response carries the basis it
// used and the client adopts it.
let mosAnchor = "p10", portfolioRows = null, portfolioMeta = null, repriced = null;
const LAB = { p10: "P10", p25: "P25", p50: "P50", p90: "P90" };
const STALE_DAYS = 7;

// `pfQuery` is what is being typed, which only decides what the box SUGGESTS;
// `pfPicked` is the filter itself. Keyed by name, not row index: the table
// re-sorts on every anchor change and a positional pick would drift.
let pfQuery = "", pfPicked = new Set();

//: How many names the box offers at once. A typeahead that lists all 83 is the
//: list it exists to replace.
const SUGGEST_MAX = 8;

//: 8 rows is ~5.7s per repaint; the whole 68-analysis record is 48.2s.
const PF_BATCH = 8;

let pfRunning = null, pfError = null;
// Supersedes an in-flight fill: another started, or the reader navigated away.
let pfGen = 0;

// Shared by the sidebar and the portfolio filter.
const queryTerms = q => String(q ?? "").toLowerCase().split(/\s+/).filter(Boolean);
const nameMatches = (name, q) => {
  const hay = String(name).toLowerCase();
  return queryTerms(q).every(t => hay.includes(t));
};

// Hand-rolled, dependency-free. Input is escaped first, so no rule below can
// inject markup.
function md2html(src) {
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");

  const lines = src.split("\n");
  const out = [];
  let i = 0, para = [], list = [];

  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  const flushList = () => { if (list.length) { out.push(`<ul>${list.map(t => `<li>${inline(t)}</li>`).join("")}</ul>`); list = []; } };
  const flush = () => { flushPara(); flushList(); };

  while (i < lines.length) {
    const ln = lines[i];

    if (/^```/.test(ln)) {                                    // fenced code
      flush(); const buf = []; i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++; out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if (/^\|/.test(ln) && /^\|[\s:|-]+\|?\s*$/.test(lines[i + 1] || "")) {   // table
      flush();
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(ln); i += 2; const body = [];
      while (i < lines.length && /^\|/.test(lines[i])) body.push(cells(lines[i++]));
      out.push(`<div class="scroll"><table><thead><tr>${
        head.map(h => `<th>${inline(h)}</th>`).join("")}</tr></thead><tbody>${
        body.map(r => `<tr>${r.map(c =>
          // Entirely a number, not merely starting with one: a leading-digit match would
          // right-align prose like "$74.90 (2026-07-24 close, Yahoo ...)".
          `<td${/^[-+±$(]?[\d.,]+\s*[%x×)]?$/.test(c.trim()) ? ' class="num"' : ""}>${
            inline(c)}</td>`).join("")}</tr>`
        ).join("")}</tbody></table></div>`);
      continue;
    }
    let m;
    if ((m = ln.match(/^(#{1,6})\s+(.*)$/))) {                // heading
      flush(); const lv = Math.min(m[1].length, 3);
      out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); i++; continue;
    }
    if (/^\s*[-*]\s+/.test(ln)) {                             // list item
      flushPara(); list.push(ln.replace(/^\s*[-*]\s+/, "")); i++; continue;
    }
    if (/^>\s?/.test(ln)) {                                   // blockquote
      flush(); out.push(`<blockquote>${inline(ln.replace(/^>\s?/, ""))}</blockquote>`); i++; continue;
    }
    if (/^(-{3,}|_{3,})\s*$/.test(ln)) { flush(); out.push("<hr>"); i++; continue; }
    if (!ln.trim()) { flush(); i++; continue; }
    flushList(); para.push(ln); i++;
  }
  flush();
  return out.join("\n");
}

async function api(path, params = {}) {
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(path + (qs ? "?" + qs : ""));
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

function showNoServer(isFile) {
  $("#search").hidden = true;   // there is nothing behind it to filter
  $("#list").innerHTML = "";
  $("#main").innerHTML = `
    <div style="max-width:60ch;margin:12vh auto 0">
      <div class="banner err">
        <b>${isFile ? "Opened as a file, not served" : "Cannot reach the viewer server"}</b>
        ${isFile
          ? "This page is the front end for a local server - on its own it has no data to read."
          : "The page loaded, but its requests to /api/ are failing. Is the server still running?"}
      </div>
      <p class="tagline">Start it from the repository root, then open the URL it prints:</p>
      <pre>python -m gui.server</pre>
      <p class="tagline">Default: <code>http://127.0.0.1:8756/</code></p>
    </div>`;
}

// Pure, so tests/test_gui_render.py can drive it. The filter matches anywhere in
// the name because names are `<date>-<TICKER>` and the ticker is the half a reader
// thinks in. The portfolio entry is never filtered out: it is the way back from a
// query that matches nothing.
// One definition, shared by the sidebar and the portfolio table, so the two can
// never disagree about the same row. `null` for an undated entry.
function ageInfo(days) {
  if (typeof days !== "number" || !isFinite(days)) return null;
  return { days, text: days === 0 ? "today" : `${days}d`, stale: days > STALE_DAYS };
}

function renderList(analyses, query, selected, grouped) {
  const terms = queryTerms(query);
  const hits = analyses.filter(a => nameMatches(a.name, query));
  const cls = key => `item${key === selected ? " active" : ""}`;
  const row = a => {
    const age = ageInfo(a.age_days);
    return `<div class="${cls(a.name)}" data-name="${esc(a.name)}">${esc(a.name)}${
      age ? `<span class="age${age.stale ? " stale" : ""}">${age.text}</span>` : ""}<input
      type="checkbox" class="pick" data-pick="${esc(a.name)}"${
      pfPicked.has(a.name) ? " checked" : ""} title="Select for Run selected"></div>`;
  };

  // Grouping re-orders, it never filters. Only multi-run tickers get a heading, the
  // same set the Timeline button is offered for.
  const body = () => {
    if (!grouped) return hits.map(row).join("");
    const by = new Map();
    hits.forEach(a => {
      const t = tickerOf(a.name) || "";
      if (!by.has(t)) by.set(t, []);
      by.get(t).push(a);
    });
    const multi = [...by.entries()].filter(([t, xs]) => t && xs.length > 1)
                                   .sort((x, y) => x[0].localeCompare(y[0]));
    const singles = [...by.entries()].filter(([t, xs]) => !t || xs.length === 1)
                                     .flatMap(([, xs]) => xs);
    const head = (t, label) =>
      `<div class="list-group" data-group-ticker="${esc(t)}">${esc(label)}`;
    return multi.map(([t, xs]) =>
        `${head(t, t)}<span>${xs.length} runs</span></div>${xs.map(row).join("")}`).join("")
      + (singles.length
        ? `${head("", "Single runs")}<span>${singles.length}</span></div>${
            singles.map(row).join("")}`
        : "");
  };

  return [
    `<div class="${cls(PORTFOLIO)}" data-portfolio="1">All analyses</div>`,
    // Inside the list, so the delegated listener on #list already handles it.
    `<div class="list-tools"><button data-group="1" class="${
      grouped ? "on" : ""}">Group by ticker</button></div>`,
    terms.length && hits.length
      ? `<div class="list-hint">${hits.length} of ${analyses.length}</div>` : "",
    body(),
    // An empty pane is indistinguishable from a broken one, so it never is.
    terms.length && !hits.length
      ? `<div class="list-none">No analysis matches <b>${esc(query)}</b></div>` : "",
  ].join("");
}

async function boot() {
  if (location.protocol === "file:") { showNoServer(true); return; }
  let analyses;
  try {
    ({ analyses } = await api("/api/analyses"));
  } catch {
    showNoServer(false);
    return;
  }
  allNames = analyses.map(a => a.name);
  drawList = () => {
    $("#list").innerHTML = renderList(analyses, $("#search").value, selected, groupByTicker);
  };
  drawList();
  $("#search").addEventListener("input", drawList);
  $("#search").addEventListener("keydown", e => {
    if (e.key === "Escape") { e.target.value = ""; drawList(); }
  });
  $("#list").addEventListener("click", e => {
    // Handled here rather than on the button, which renderList rebuilds on every
    // keystroke - binding per draw would stack a listener per render.
    if (e.target.closest("[data-group]")) { groupByTicker = !groupByTicker; drawList(); return; }
    if (e.target.closest("[data-portfolio]")) { showPortfolio(); return; }
    const pick = e.target.closest("[data-pick]");
    if (pick) { togglePick(pick.dataset.pick); return; }
    const el = e.target.closest(".item");
    if (el && el.dataset.name) select(el.dataset.name);
  });
  wireMain();
  const wanted = decodeURIComponent(location.hash.slice(1));
  if (wanted && analyses.some(a => a.name === wanted)) select(wanted);
  window.addEventListener("hashchange", () => {
    const n = decodeURIComponent(location.hash.slice(1));
    if (n && n !== current && analyses.some(a => a.name === n)) select(n);
  });
}

// A second implementation of the server's `_ticker_of`: it decides whether the
// Timeline button is offered, so a pattern that drifts narrower hides the feature
// while every render test stays green. tests/test_gui_render.py pins the two.
const tickerOf = n => (String(n ?? "").match(/^\d{4}-\d{2}-\d{2}-([A-Za-z0-9.-]{1,12})$/) || [])[1];

// Every analysis of the same company, this one included.
function siblingRuns(name) {
  const t = tickerOf(name);
  return t ? allNames.filter(n => tickerOf(n) === t) : [];
}

// The quote if there is one, else the spec's own. The quote leads because the spec
// price is what the analyst typed on the analysis date and this set spans days to
// weeks - the question being asked is "is it cheap now?".
function defaultPrice(a) {
  return a?.current_price ?? a?.spec_price ?? "";
}

function priceBox(a, override, busy) {
  const off = busy ? " disabled" : "";
  const quote = a?.current_price;
  return `<span class="price-box">
    <label for="price">Price</label>
    <input id="price" type="text" inputmode="decimal" value="${
      esc(override ?? defaultPrice(a))}"${off}>
    <span class="hint">spec ${a?.spec_price ?? "?"}</span>
    <button data-act="reset-price"${off} title="back to the default price">Reset</button>
    ${quote != null
      ? `<button data-act="use-spec"${off}
           title="the price this analysis was published at"
           >Use spec ${fmt(a.spec_price)}</button>
         <span class="hint" title="quote as of ${esc(a.current_as_of || "")}${
           a.current_live ? " - LIVE intraday, still moving" : " - settled close"}"
           >quote ${fmt(quote)}${a.current_live ? " (live)" : ""}</span>`
      : `<span class="hint" title="run: python -m prices.fetch">no quote</span>`}
  </span>`;
}

async function select(name) {
  if (busy) return;   // a run is in flight against the current spec; let it finish
  // A price typed for one company must never carry over to the next.
  current = name; selected = name;
  cache = {}; tab = "report"; priceOverride = null; compareWith = "";
  if (decodeURIComponent(location.hash.slice(1)) !== name) location.hash = encodeURIComponent(name);
  drawList();
  render();
  cache.analysis = await api("/api/analysis", { name });
  render();
}

function render() {
  if (!current) return;
  const a = cache.analysis;
  $("#main").innerHTML = `
    <h2>${esc(current)}</h2>
    <div class="tagline">${a ? "Stage 1 report and Stage 2 spec" : "loading…"}</div>
    <div class="actions">
      ${priceBox(a, priceOverride, busy)}
      ${[["validate", "Validate"], ["run", "Run Monte Carlo"],
         ["ladder", "Price ladder"], ["worlds", "Worlds"],
         ["convergence", "Convergence"],
         // Offered only where it can answer something: a timeline of one run is valid but
         // advertises a comparison that does not exist.
         ...(siblingRuns(current).length > 1 ? [["timeline", "Timeline"]] : [])].map(
        ([k, label]) => `<button data-act="${k}"${busy ? " disabled" : ""}>${
          busy === k ? "Running…" : label}</button>`).join("")}
    </div>
    <div class="cmp-sel">
      <label for="cmp">Compare with</label>
      <select id="cmp"${busy ? " disabled" : ""}>
        <option value="">-</option>
        ${allNames.filter(n => n !== current).map(n =>
          `<option value="${esc(n)}"${compareWith === n ? " selected" : ""}>${esc(n)}</option>`).join("")}
      </select>
      <button data-act="compare"${busy || !compareWith ? " disabled" : ""}>${
        busy === "compare" ? "Running…" : "Compare"}</button>
    </div>
    <div class="tabs">
      ${["report", "spec", "model", "results"].map(t =>
        `<div class="tab ${t === tab ? "active" : ""}" data-tab="${t}">${t}</div>`).join("")}
    </div>
    <div id="body"></div>
    <footer>Read-only. Nothing here edits a spec or writes back to disk.</footer>`;
  paint();
}

// Bound once, on the persistent #main, not inside render(). render() only
// replaces #main's innerHTML - the element itself survives - so registering
// here per render stacked a new listener every time. Two listeners meant one
// click ran act() twice: two concurrent 50,000-draw runs finishing at
// different moments, each re-rendering, each adding more listeners. That was
// the flicker, and it compounded with every render.
function wireMain() {
  $("#main").addEventListener("click", async e => {
    const t = e.target.closest(".tab");
    if (t) {
      tab = t.dataset.tab;
      render();
      // The only tab that costs a request, so it is fetched on first open and cached for
      // the rest of this analysis. `cache` is cleared by select().
      if (tab === "model" && !cache.model && !cache.modelError && current) {
        const want = current;
        try { const d = await api("/api/model", { name: current }); if (want === current) cache.model = d; }
        catch (err) { if (want === current) cache.modelError = err.message; }
        if (tab === "model" && want === current) paint();
      }
      return;
    }
    // On the delegated listener, not re-registered after each ladder render.
    const m = e.target.closest("button[data-mos]");
    if (m && cache.ladder) {
      mosAnchor = m.dataset.mos;
      cache.results = renderLadder(cache.ladder);
      paint();
      return;
    }
    const b = e.target.closest("button[data-act]");
    if (!b) return;
    if (b.dataset.act === "reset-price") { priceOverride = null; render(); return; }
    if (b.dataset.act === "use-spec") {
      priceOverride = String(cache.analysis?.spec_price ?? "");
      render();
      return;
    }
    await act(b.dataset.act);
  });
  // Module state, never read out of the DOM at submit time: render() rebuilds the
  // input, and re-rendering per keystroke would destroy focus.
  $("#main").addEventListener("input", e => {
    if (e.target.id === "price") priceOverride = e.target.value;
    // Repainting only the body below the input is what lets the caret survive the
    // keystroke that triggered it.
    if (e.target.id === "pf-filter") { pfQuery = e.target.value; paintPortfolioBody(); }
  });
  // Enter in the price field runs, which is what typing a price implies.
  $("#main").addEventListener("keydown", e => {
    if (e.target.id === "price" && e.key === "Enter" && !busy) act("run");
    if (e.target.id === "pf-filter") {
      // Escape clears the box, exactly as it does in the sidebar's search box.
      if (e.key === "Escape") { e.target.value = ""; pfQuery = ""; paintPortfolioBody(); }
      // preventDefault: this input is not in a form, and Enter in a search field reloads
      // in some browsers, which would drop every chip.
      if (e.key === "Enter") {
        e.preventDefault();
        const first = pfSuggest(portfolioRows || [])[0];
        if (first) pfAdd(first);
      }
      if (e.key === "Backspace" && !e.target.value && pfPicked.size) {
        pfDrop([...pfPicked][pfPicked.size - 1]);
      }
    }
  });
  $("#main").addEventListener("change", e => {
    // change, not input: a <select> fires once on commit, so no focus is lost.
    if (e.target.id === "cmp") { compareWith = e.target.value; render(); }
  });
}

function pfBatches(names, size) {
  const step = Math.max(1, Math.floor(size) || 0);   // a step of 0 never terminates
  const out = [];
  for (let i = 0; i < names.length; i += step) out.push(names.slice(i, i + step));
  return out;
}

// Opens from cache (~0.2s) whatever was asked for, then fills underneath.
async function showPortfolio(run = false, names = null) {
  if (busy) return;
  const gen = ++pfGen;
  current = null; selected = PORTFOLIO; cache = {}; compareWith = "";
  pfRunning = null; pfError = null;
  drawList();
  $("#main").innerHTML = `<h2>All analyses</h2>
    <div class="tagline">Loading cached results.</div>`;
  // "0" sent explicitly once the basis is chosen: an omitted parameter asks for the
  // default and would silently undo a deliberate "As analysed".
  const basis = repriced === null ? {} : { repriced: repriced ? "1" : "0" };
  try {
    const d = await api("/api/portfolio", { run: "0", ...basis });
    if (gen !== pfGen) return;
    portfolioRows = d.portfolio; portfolioMeta = d;
    repriced = d.repriced;
    paintPortfolio();
  } catch (err) {
    if (gen !== pfGen) return;
    $("#main").innerHTML = `<h2>All analyses</h2>
      <div class="banner err"><b>Failed</b>${esc(err.message)}</div>`;
    return;
  }
  if (run) await fillPortfolio(gen, basis, names);
}

// Every response is the whole table, so a batch replaces the row set wholesale.
// Pinned by `test_successive_named_runs_accumulate`.
async function fillPortfolio(gen, basis, names) {
  const pending = (portfolioRows || [])
    .filter(r => r.status === "not run" && (!names || names.includes(r.name)))
    .map(r => r.name);
  if (!pending.length) return;

  pfRunning = { done: 0, total: pending.length };
  paintPortfolioBody();
  try {
    for (const batch of pfBatches(pending, PF_BATCH)) {
      let d;
      try {
        d = await api("/api/portfolio", { run: "1", names: batch.join(","), ...basis });
      } catch (err) {
        if (gen === pfGen) pfError = err.message;   // rows already painted stay
        return;
      }
      if (gen !== pfGen || selected !== PORTFOLIO) return;
      portfolioRows = d.portfolio; portfolioMeta = d;
      repriced = d.repriced;
      pfRunning = { done: pfRunning.done + batch.length, total: pending.length };
      paintPortfolioBody();
    }
  } finally {
    if (gen === pfGen) {   // a superseding fill owns the state now
      pfRunning = null;
      if (selected === PORTFOLIO) paintPortfolioBody();
    }
  }
}

// The filter input lives in the shell, not the body: rewriting an input while it
// has focus destroys the caret mid-word.
function paintPortfolio() {
  if (!portfolioRows) return;
  $("#main").innerHTML = `<h2>All analyses</h2>
    <div class="pf-filter"><div class="pf-box"><input id="pf-filter" type="search"
      autocomplete="off" spellcheck="false"
      placeholder="Type a ticker or date, then click a name to add it">
      <div id="pf-suggest"></div></div></div>
    <div id="pf-body"></div>`;
  // Assigned, not interpolated. `esc()` deliberately does not escape quotes, and
  // this is what the reader typed - a single `"` would close the attribute. A
  // property assignment has no parsing step to break out of.
  $("#pf-filter").value = pfQuery;
  paintPortfolioBody();
}

// Re-anchoring, filtering and picking are all pure re-renders off the original
// run. Every listener below is bound on a child of the innerHTML just written,
// which is why anchor 20 classifies by receiver rather than by caller.
function paintPortfolioBody() {
  const body = $("#pf-body"); if (!body) return;
  const drop = $("#pf-suggest");
  if (drop) {
    drop.innerHTML = renderSuggest(portfolioRows);
    drop.querySelectorAll("[data-pf-add]").forEach(el =>
      el.addEventListener("click", () => pfAdd(el.dataset.pfAdd)));
  }
  body.innerHTML = renderPortfolio(portfolioRows);
  body.querySelectorAll(".pf-row").forEach(row =>
    row.addEventListener("click", () => select(row.dataset.open)));
  body.querySelectorAll("[data-pf-chip]").forEach(b =>
    b.addEventListener("click", () => pfDrop(b.dataset.pfChip)));
  body.querySelectorAll("[data-pf-clear]").forEach(b =>
    b.addEventListener("click", () => { pfPicked.clear(); drawList(); paintPortfolioBody(); }));
  body.querySelectorAll("[data-pf-run]").forEach(b =>
    b.addEventListener("click", () => showPortfolio(true)));
  body.querySelectorAll("[data-pf-run-selected]").forEach(b =>
    b.addEventListener("click", () => showPortfolio(true, [...pfPicked])));
  body.querySelectorAll("[data-anchor]").forEach(b =>
    b.addEventListener("click", () => { mosAnchor = b.dataset.anchor; paintPortfolioBody(); }));
  // A different price is a different run, unlike re-anchoring.
  body.querySelectorAll("[data-basis]").forEach(b =>
    b.addEventListener("click", () => {
      const want = b.dataset.basis === "current";
      if (want !== repriced) { repriced = want; showPortfolio(); }
    }));
}

// Clearing the query too: the name is a chip now, and the box would otherwise go
// on suggesting it.
function pfAdd(name) {
  if (!name) return;
  pfPicked.add(name);
  drawList();
  pfQuery = "";
  const box = $("#pf-filter");
  if (box) box.value = "";
  paintPortfolioBody();
}

function pfDrop(name) {
  if (!name) return;
  pfPicked.delete(name);
  drawList();
  paintPortfolioBody();
}

function togglePick(name) {
  if (pfPicked.has(name)) pfPicked.delete(name); else pfPicked.add(name);
  drawList();
  if (selected === PORTFOLIO) paintPortfolioBody();
}

function paint() {
  const el = $("#body"); if (!el) return;
  const a = cache.analysis;
  if (tab === "report") {
    el.innerHTML = a?.md ? `<div class="md">${md2html(a.md)}</div>`
                         : `<p class="tagline">No .md file.</p>`;
  } else if (tab === "spec") {
    el.innerHTML = a?.yaml ? `<pre>${esc(a.yaml)}</pre>`
                           : `<p class="tagline">No .yaml file.</p>`;
  } else if (tab === "model") {
    // Three states kept distinct: a failure must not render as an empty panel, which
    // is how a spec the validator refused would otherwise look.
    el.innerHTML = cache.modelError
      ? `<div class="banner err"><b>Failed</b>${esc(cache.modelError)}</div>`
      : cache.model ? renderMarginals(cache.model) + renderFactors(cache.model)
      : `<p class="tagline">Loading…</p>`;
  } else {
    el.innerHTML = cache.results || `<p class="tagline">Run an action above.</p>`;
  }
}

async function act(kind) {
  // `busy` is module state because btn.disabled would not survive the render()
  // below. Without it a double-click queues two 50,000-draw runs.
  if (busy) return;
  busy = kind;
  tab = "results";
  cache.results = `<p class="tagline">Running ${esc(kind)}…${
    kind === "ladder" ? " One model run per rung, so this takes a few seconds." :
    kind === "convergence" ? " Re-running at double the draws, so this takes a moment." : ""}</p>`;
  render();
  // The effective price, not the typed one: an untouched field means the current
  // quote, and reading the override alone would show the quote in the box while
  // running the spec's price behind it.
  const spec = cache.analysis?.spec_price;
  const typed = (priceOverride ?? "").toString().trim();
  const p = typed || String(defaultPrice(cache.analysis) ?? "");
  const params = { name: current };
  if (p && Number(p) !== Number(spec)) params.price = p;
  try {
    if (kind === "validate") {
      const v = await api("/api/validate", { name: current });
      cache.results = renderValidate(v);
    } else if (kind === "run") {
      cache.results = renderRun(await api("/api/run", params));
    } else if (kind === "ladder") {
      // The payload is kept: re-anchoring the margin column re-renders off it.
      cache.ladder = await api("/api/ladder", params);
      cache.results = renderLadder(cache.ladder);
    } else if (kind === "timeline") {
      cache.results = renderTimeline(
        await api("/api/timeline", { ticker: tickerOf(current) }));
    } else if (kind === "convergence") {
      cache.results = renderConvergence(await api("/api/convergence", { name: current }));
    } else if (kind === "compare") {
      cache.results = renderCompare(await api("/api/compare", { a: current, b: compareWith }));
    } else {
      const w = await api("/api/worlds", { name: current });
      cache.results = renderWorlds(w.worlds, w.marginals);
    }
  } catch (err) {
    cache.results = `<div class="banner err"><b>Failed</b>${esc(err.message)}</div>`;
  } finally {
    busy = null;   // finally, so a failed run does not wedge the UI permanently
  }
  render();
}

function renderValidate(v) {
  let h = v.ok
    ? `<div class="banner ok"><b>Valid</b>No blocking errors.</div>`
    : `<div class="banner err"><b>${v.errors.length} error(s)</b>${
        v.errors.map(e => `[${esc(e.code)}] ${esc(e.message)}`).join("<br>")}</div>`;
  if (v.notices.length) {
    h += `<div class="banner warn"><b>${v.notices.length} notice(s)</b>${
      v.notices.map(n => `[${esc(n.code)}] ${esc(n.message)}`).join("<br>")}</div>`;
  } else if (v.ok) {
    h += `<div class="banner ok"><b>No notices</b>Marginals reproduce their stated p10/p90.</div>`;
  }
  return h;
}

// Two cases, worded differently on purpose. An arbitrary typed price is a
// hypothetical; the market quote is not, but re-pricing refreshes only the price
// while the value view still dates from the analysis.
function whatIfBanner(r) {
  if (!r.overridden) return "";
  const a = cache.analysis;
  const atMarket = a?.current_price != null
    && Math.abs(Number(r.price_used) - Number(a.current_price)) < 1e-9;
  const shared = `The value distribution below is unchanged - price does not
    enter the valuation - so only P(undervalued) and margin of safety differ.`;

  if (!atMarket) {
    return `<div class="banner whatif"><b>What-if - not this analysis's price</b>
      Run at <strong>${fmt(r.price_used)}</strong>; the spec's price is
      ${fmt(r.spec_price)}. ${shared}</div>`;
  }
  const age = ageInfo(a.age_days);
  return `<div class="banner whatif">
    <b>Re-priced to the market - only the price is current</b>
    Run at the quote of <strong>${fmt(r.price_used)}</strong>${
      a.current_as_of ? ` (as of ${esc(a.current_as_of)})` : ""}; the spec's price
    is ${fmt(r.spec_price)}. ${shared}
    ${a.current_live
      ? `<br><strong>That quote is a LIVE intraday price, not a settled close</strong>,
         so it is still moving and this number will not reproduce. Re-run after
         the close for a figure two runs agree on.`
      : ""}
    ${age?.stale
      ? `<br><strong>This analysis is ${age.days} days old</strong>, so the value
         view behind these numbers predates up to ${age.days} days of news.
         Re-pricing is not refreshing: a fresh price against a stale set of
         fundamentals can read more confidently than it deserves.`
      : ""}</div>`;
}

// The domain always includes the price, so a price outside the P10-P90 band stays
// on screen rather than pinning silently to an edge.
function rangeStrip(p) {
  const lo = p.value_p10, mid = p.value_p50, hi = p.value_p90, price = p.price;
  const anchor = p.value_p25;   // conservative value anchor; may be absent on an old payload
  if (![lo, mid, hi].every(v => typeof v === "number" && isFinite(v))) return "";
  const hasPrice = typeof price === "number" && isFinite(price);
  const min = Math.min(lo, hasPrice ? price : lo), max = Math.max(hi, hasPrice ? price : hi);
  const pad = (max - min) * 0.08 || 1;
  const d0 = min - pad, d1 = max + pad;
  const at = v => ((v - d0) / (d1 - d0)) * 100;

  return `<div class="viz">
    <div class="viz-head">Value per share</div>
    <div class="viz-sub">P10 to P90 band, P50 marked${
      typeof anchor === "number" && isFinite(anchor)
        ? `; the hairline at ${fmt(anchor)} is the P25 conservative anchor, and price at or below it means paying under a conservative estimate of value`
        : ""}${hasPrice ? "; price shown as the reference line" : ""}</div>
    <div class="strip">
      <div class="strip-track" title="P10 ${fmt(lo)} · P25 ${fmt(anchor)} · P50 ${fmt(mid)} · P90 ${fmt(hi)}">
        <div class="strip-band" style="left:${at(lo)}%;width:${at(hi) - at(lo)}%"></div>
        ${typeof anchor === "number" && isFinite(anchor)
          ? `<div class="strip-p25" style="left:${at(anchor)}%"></div>` : ""}
        <div class="strip-p50" style="left:${at(mid)}%"></div>
      </div>
      ${hasPrice ? `<div class="strip-price" style="left:${at(price)}%">
        <span class="strip-price-lab">price ${fmt(price)}</span></div>` : ""}
      <span class="strip-tick" style="left:${at(lo)}%">P10 <b>${fmt(lo)}</b></span>
      <span class="strip-tick" style="left:${at(mid)}%">P50 <b>${fmt(mid)}</b></span>
      <span class="strip-tick" style="left:${at(hi)}%">P90 <b>${fmt(hi)}</b></span>
    </div>
  </div>`;
}

// Bars are split at the price, so the blue area IS p_undervalued.
function histogram(hh, p) {
  if (!hh || !hh.counts || !hh.counts.length) return "";
  const { counts, edges, lo, hi, below, above, n, price } = hh;
  const max = Math.max(...counts) || 1;
  const at = v => ((v - lo) / (hi - lo)) * 100;
  const inside = v => typeof v === "number" && isFinite(v) && v >= lo && v <= hi;
  const hasPrice = inside(price);
  // Values deliberately not repeated in the labels: the range strip above carries
  // them, and "P50 72.20" would overprint "price 74.90".
  const qs = p ? [["P10", p.value_p10], ["P25", p.value_p25], ["P50", p.value_p50], ["P90", p.value_p90]]
                  .filter(([, v]) => inside(v)) : [];

  return `<div class="viz">
    <div class="viz-head">Distribution of value</div>
    <div class="viz-sub">${n.toLocaleString()} draws${hasPrice
      ? `; bars right of the price line are the draws worth more than it` : ""}</div>
    <div class="hist-wrap">
      <div class="hist">${counts.map((c, i) => {
        const mid = (edges[i] + edges[i + 1]) / 2;
        const over = hasPrice && mid < price;
        return `<i class="${over ? "over" : ""}" style="height:${
          Math.max(1, (c / max) * 100)}%" title="${fmt(edges[i])} to ${
          fmt(edges[i + 1])}: ${c.toLocaleString()} draws"></i>`;
      }).join("")}</div>
      ${qs.map(([lab, v]) =>
        `<div class="hist-q" style="left:${at(v)}%" title="${lab} ${fmt(v)}"><b>${lab}</b></div>`
      ).join("")}
      ${hasPrice
        ? `<div class="hist-price" style="left:${at(price)}%" title="price ${fmt(price)}">
             <span class="hist-price-lab">price ${fmt(price)}</span></div>` : ""}
      <div class="hist-ax">
        <span style="left:0">${fmt(lo)}</span>
        <span style="right:0">${fmt(hi)}</span>
      </div>
    </div>
    ${(below || above) ? `<div class="hist-tail">Axis clipped to the 0.5th-99.5th
      percentile for legibility: ${below.toLocaleString()} draws fall below it and
      ${above.toLocaleString()} above. They are counted here, not discarded.</div>` : ""}
  </div>`;
}

// Sign is encoded three ways - side of the zero rule, hue, signed label - so it
// never rests on colour alone. `note` is optional per-row markup built by the
// caller and inserted raw, so every value inside it must already be escaped.
function divBars(title, sub, rows, domain) {
  const d = domain || Math.max(...rows.map(r => Math.abs(r.value)), 1e-9);
  const noted = rows.some(r => r.note);
  return `<div class="viz">
    <div class="viz-head">${esc(title)}</div>
    <div class="viz-sub">${esc(sub)}</div>
    <div class="dv${noted ? " dv-noted" : ""}">${rows.map(r => {
      const w = Math.min(Math.abs(r.value) / d, 1) * 50;
      const pos = r.value >= 0;
      return `<div class="dv-name">${esc(r.name)}</div>
        <div class="dv-track" title="${esc(r.name)}: ${esc(r.label)}">
          <div class="dv-zero"></div>
          <div class="dv-bar ${pos ? "pos" : "neg"}" style="${
            pos ? `left:50%;width:${w}%` : `right:50%;width:${w}%`}"></div>
        </div>
        <div class="dv-val">${esc(r.label)}</div>${noted ? r.note || "<div></div>" : ""}`;
    }).join("")}</div>
  </div>`;
}

// The bar is a Spearman rank correlation and is scale-free: it says how
// monotonically value tracks a driver, never by how much. On the golden spec
// `div_growth` is the fourth bar at +0.450 and moves value 0.376, least of the
// six, while `affo_terminal` is drawn shorter at +0.317 and moves it 1.146.
// The bar keeps its own length and order; rescaling by band width would assume
// uncertainty is proportional to magnitude.
function swingNote(s, worst) {
  if (!s) return "<div></div>";
  const w = worst > 0 ? Math.min(Math.abs(s.swing) / worst, 1) * 100 : 0;
  // The band is the stated one, the swing is measured across what the model draws.
  // Three of five families differ, so a row where they do is marked.
  const drifted = s.drift_flagged;
  return `<div class="sw">
    <div class="sw-track"><i class="sw-bar" style="width:${w.toFixed(1)}%"></i></div>
    <span class="sw-val" title="Moving ${esc(s.name)} from its p10 to its p90 with
      every other driver at its median moves the value from ${fmt(s.value_lo)} to
      ${fmt(s.value_hi)}.">${fmt(s.swing)}</span>
    <span class="sw-band${drifted ? " sw-drift" : ""}"${drifted
      ? ` title="Stated ${fmt(s.p10)} to ${fmt(s.p90)}, but this ${esc(s.family)}
          marginal actually draws ${fmt(s.input_lo)} to ${fmt(s.input_hi)} - the
          swing is measured across what is drawn. See the model tab."`
      : ""}>${fmt(s.p10)} to ${fmt(s.p90)}${drifted ? " !" : ""}</span>
  </div>`;
}

function renderRun(r) {
  const p = r.payload;
  const warns = p.warnings || [];
  // An unrecognised contract means fields this page reads may have been renamed or
  // dropped, and every one would render blank. Say so at the top.
  const sch = r.schema;
  let h = (sch && sch.supported === false
    ? `<div class="banner err"><b>Unrecognised report schema</b>This viewer reads
        report_schema_version ${esc(sch.expected)}; this payload says ${
          esc(String(sch.got))}. Fields below may be missing or renamed - the
        numbers shown are not trustworthy until the viewer is updated.</div>`
    : "");
  // A WARNINGS block means the number is not a result. Lead with it.
  h += whatIfBanner(r) + (warns.length
    ? `<div class="banner err"><b>${warns.length} warning(s) - do not quote these numbers</b>${
        warns.map(w => esc(w)).join("<br>")}</div>`
    : `<div class="banner ok"><b>Clean run</b>No floored draws, no degenerate p_undervalued.</div>`);

  // The MC stderr rides with the hero number at 4 dp: shown as "0.00" it reads as
  // "no uncertainty", which is an artefact to flag rather than round away.
  const pu = p.p_undervalued, se = p.p_undervalued_stderr;
  if (typeof pu === "number" && isFinite(pu)) {
    h += `<div class="hero">
      <div class="lab">P(undervalued)</div>
      <div class="val">${pu.toFixed(4)}</div>
      <div class="sub">±${isFinite(se) ? se.toFixed(4) : "?"} Monte Carlo standard error${
        (pu === 0 || pu === 1) ? " - a 0 or 1 here is too-narrow inputs, not certainty" : ""}</div>
    </div>`;
  }

  h += rangeStrip(p);
  h += histogram(r.histogram, p);

  const mos = [["P10", p.mos_p10], ["P25", p.mos_p25], ["P50", p.mos_p50], ["P90", p.mos_p90]]
    .filter(([, v]) => typeof v === "number" && isFinite(v))
    .map(([k, v]) => ({ name: k, value: v, label: `${v >= 0 ? "+" : ""}${(v * 100).toFixed(1)}%` }));
  if (mos.length) {
    h += divBars("Margin of safety",
      "Value against price at each percentile; zero is break-even. P25 is the conservative anchor.", mos);
  }

  const t = p.tornado || [];
  if (t.length) {
    const sens = r.sensitivity || {};
    const worst = Math.max(...Object.values(sens).map(s => Math.abs(s.swing)), 0);
    h += divBars(
      "Tornado",
      Object.keys(sens).length
        ? "Bars are Spearman rank correlation, which is scale-free: it says how "
          + "consistently value follows a driver, not by how much. The column beside "
          + "each bar is that driver's swing - the value moves this far between its "
          + "p10 and p90 with the others held at their medians - and its stated band. "
          + "The two can disagree: a driver can track value closely and still barely "
          + "move it."
        : "Spearman rank correlation of each driver with value; bars diverge by sign.",
      t.map(x => ({
        name: x.driver,
        value: x.rank_corr,
        label: x.rank_corr.toFixed(3),
        note: swingNote(sens[x.driver], worst),
      })), 1);
  }
  h += `<h3>Full output</h3><pre>${esc(r.text)}</pre>`;
  h += `<footer>report_schema_version ${esc(p.report_schema_version)}${
    sch && sch.supported ? " (recognised)" : ""}</footer>`;
  return h;
}

function renderLadder(d) {
  const overridden = Number(d.centre) !== Number(d.spec_price);
  let h = overridden
    ? whatIfBanner({ overridden: true, price_used: d.centre, spec_price: d.spec_price })
    : `<div class="banner ok"><b>Price ladder</b>Centred on the spec's price,
        ${fmt(d.spec_price)}. Every rung uses the same seed and the same value
        distribution, so these are exact comparisons, not Monte Carlo noise.</div>`;

  // `data-mos` rather than the portfolio's `data-anchor`: the two live in the same
  // #main, and one handler matching both would cross-fire.
  h += `<div class="mos-pick">
      <span>Margin of safety at</span>
      ${["p10", "p25", "p50", "p90"].map(k =>
        `<button data-mos="${k}" class="${k === mosAnchor ? "on" : ""}">${LAB[k]}</button>`
      ).join("")}
      <span class="tag">no re-run needed - all four come back with the same run</span>
    </div>`;

  const key = `mos_${mosAnchor}`;
  h += `<table class="tornado-t"><thead><tr>
      <th>Price</th><th>P(undervalued)</th><th style="width:34%"></th>
      <th>MoS (${LAB[mosAnchor]})</th><th></th>
    </tr></thead><tbody>${d.ladder.map(r => `
      <tr class="${r.is_centre ? "centre" : ""}">
        <td class="num">${r.price.toFixed(2)}</td>
        <td class="num">${r.p_undervalued.toFixed(4)}</td>
        <td><div class="meter" title="P(undervalued) ${r.p_undervalued.toFixed(4)}"><i style="width:${
          (r.p_undervalued * 100).toFixed(1)}%"></i><u></u></div></td>
        <td class="num">${r[key] >= 0 ? "+" : ""}${(r[key] * 100).toFixed(1)}%</td>
        <td class="tag">${r.is_spec ? "spec price" : (r.is_centre ? "your price" : "")}</td>
      </tr>`).join("")}</tbody></table>
    <p class="tagline">The hairline on each meter is 0.50 - the price at which
    the distribution is an even bet. P(undervalued) and the meter do NOT follow
    the anchor - only the margin column does - so the rungs keep their order
    whichever anchor you read.</p>`;
  return h;
}

function renderConvergence(d) {
  const c = d.convergence;
  const rows = [
    ["Value P50", c.value_p50_N, c.value_p50_2N, 2],
    ["P(undervalued)", c.p_undervalued_N, c.p_undervalued_2N, 4],
  ].filter(([, a]) => typeof a === "number");
  return `<div class="banner ok"><b>Convergence check</b>
      The same spec re-run at double the draws (${d.n.toLocaleString()} then
      ${(d.n * 2).toLocaleString()}, same seed). Small drift means the sample is
      large enough for the statistic to have settled; large drift means it is not.</div>
    <table class="tornado-t"><thead><tr><th></th>
      <th>N = ${d.n.toLocaleString()}</th><th>2N</th><th>Drift</th></tr></thead>
    <tbody>${rows.map(([k, a, b, dp]) => {
      const delta = b - a;
      const rel = a !== 0 ? Math.abs(delta / a) : 0;
      return `<tr><td>${esc(k)}</td><td class="num">${a.toFixed(dp)}</td>
        <td class="num">${b.toFixed(dp)}</td>
        <td class="num ${rel < 0.01 ? "same" : (delta >= 0 ? "up" : "down")}">${
          delta >= 0 ? "+" : ""}${delta.toFixed(dp)} (${(rel * 100).toFixed(2)}%)</td></tr>`;
    }).join("")}</tbody></table>`;
}

// The chips are the filter, and the only filter. No chips means the whole record;
// one or more means exactly those.
function pfShown(rows) {
  return pfPicked.size ? rows.filter(r => pfPicked.has(r.name)) : rows;
}

// Data rather than markup: Enter commits the first one.
function pfSuggest(rows) {
  if (!queryTerms(pfQuery).length) return [];
  return rows.map(r => r.name).filter(n => !pfPicked.has(n) && nameMatches(n, pfQuery));
}

function renderSuggest(rows) {
  if (!queryTerms(pfQuery).length) return "";
  const hits = pfSuggest(rows);
  if (!hits.length) {
    return `<div class="pf-suggest"><div class="pf-suggest-none">No analysis matches
      <b>${esc(pfQuery)}</b></div></div>`;
  }
  const shown = hits.slice(0, SUGGEST_MAX);
  // Counted rather than dropped: a list silently cut at 8 reads as all there is.
  return `<div class="pf-suggest">${shown.map(n =>
      `<div class="pf-suggest-item" data-pf-add="${esc(n)}">${esc(n)}</div>`).join("")}${
    hits.length > shown.length
      ? `<div class="pf-suggest-more">${hits.length - shown.length} more &ndash; keep
         typing to narrow</div>`
      : ""}</div>`;
}

// The filter, stated in one place and undoable a name at a time.
function pfBar(picked) {
  if (!picked.length) {
    return `<div class="pf-sel"><span class="tag">Type to find an analysis, then
      click it to add it. Add more than one to compare them.</span></div>`;
  }
  return `<div class="pf-sel">
    <span>${picked.length === 1 ? "Showing" : "Comparing"}</span>
    ${picked.map(n => `<button class="pf-chip" data-pf-chip="${esc(n)}"
        title="remove ${esc(n)} from the comparison">${esc(n)} &times;</button>`).join("")}
    <button data-pf-clear="1">Clear</button>
  </div>`;
}

function renderPortfolio(rows) {
  const key = `mos_${mosAnchor}`;
  const shown = pfShown(rows);
  const cut = pfPicked.size > 0;
  const okAll = rows.filter(r => r.status === "ok").length;
  const pendingAll = rows.filter(r => r.status === "not run").length;
  const scope = pendingAll ? "Each spec run so far" : "Every saved spec";
  // `n of N` is what a filter earns, and only then: an undisclosed subset read
  // as the whole record is the README test-count failure in a rendered view.
  const count = (n, all) => cut ? `${n} of ${all}` : `${n}`;
  // The ranking follows the anchor: ranking on P(undervalued) while displaying a P10
  // margin would put the two most important columns in disagreement.
  const ok = shown.filter(r => r.status === "ok")
                 .sort((a, b) => (b[key] ?? -Infinity) - (a[key] ?? -Infinity));
  const bad = shown.filter(r => r.status !== "ok" && r.status !== "not run");

  let h = pfBar(rows.filter(r => pfPicked.has(r.name)).map(r => r.name));
  if (pfError) {
    h += `<div class="banner err"><b>Fill stopped</b>${esc(pfError)}<br>The rows
      below are the ones that did run. Run again to finish; cached results are
      not recomputed.</div>`;
  }
  // Withheld, not disabled: a disabled button says busy, not how far it has got.
  if (pfRunning) {
    h += `<div class="pf-sel"><span><b>Running ${pfRunning.done} of ${
      pfRunning.total}</b> - rows appear as each batch lands, and the ranking
      below covers what has run so far.</span></div>`;
  } else if (pendingAll) {
    const pickedPending = rows.filter(r => r.status === "not run" && pfPicked.has(r.name)).length;
    h += `<div class="pf-sel"><span><b>${pendingAll} of ${rows.length}</b> not run
      yet; results stay cached until a spec changes.</span>
      <button data-pf-run-selected="1"${pickedPending ? "" : " disabled"}>Run selected (${
        pickedPending})</button>
      <button data-pf-run="1">Run all (${pendingAll})</button></div>`;
  }
  h += `<div class="banner ok"><b>${count(ok.length, okAll)} analyses</b>
    ${repriced
      ? `${scope}, re-run at the latest quote - the price is current, the
         value view is not.`
      : `${scope}, run at its own spec price and seed - these are the
         shipped numbers, not re-priced ones.`} Ranked by margin of safety at
    <strong>${LAB[mosAnchor]}</strong>.${mosAnchor === "p10"
      ? " P10 is the default because margin of safety is a question about the"
        + " downside: a name can look healthy on its median and still carry a"
        + " severe bad case."
      : mosAnchor === "p25"
      ? " P25 is the conservative value anchor: value does not depend on price,"
        + " so a positive margin here means you are paying less than a"
        + " deliberately conservative estimate of value. Do not stack it on top"
        + " of a quality-tier margin requirement - that double-counts."
      : ""}</div>`;

  h += `<div class="mos-pick">
      <span>Margin of safety at</span>
      ${["p10", "p25", "p50", "p90"].map(k =>
        `<button data-anchor="${k}" class="${k === mosAnchor ? "on" : ""}">${LAB[k]}</button>`
      ).join("")}
      <span class="tag">no re-run needed - all four come back with the same run</span>
    </div>`;

  // Offered beside the age column: re-pricing changes only the price, and the two
  // have to be read together.
  const cur = portfolioMeta?.current;
  h += `<div class="mos-pick">
      <span>Price basis</span>
      <button data-basis="spec" class="${repriced ? "" : "on"}">As analysed</button>
      <button data-basis="current" class="${repriced ? "on" : ""}"${
        cur?.available ? "" : " disabled"}>Current</button>
      <span class="tag">${cur?.available
        ? `quotes as of ${esc((cur.as_of || "").slice(0, 10))} - refresh with
           <code>python -m prices.fetch</code>`
        : `no prices.json yet - run <code>python -m prices.fetch</code> to enable`}</span>
    </div>`;

  if (repriced) {
    h += `<div class="banner whatif"><b>Re-priced - only the price is current</b>
      Each row is re-run at the latest quote, but its <strong>value</strong>
      distribution still reflects the fundamentals as of the analysis date. A row
      flagged stale below is pairing a current price with an old view of the
      business. Measured example from this repo: at an identical 74.90, the
      2026-07-19 A12 spec returns p_undervalued 0.3823 against the 2026-07-25
      spec's 0.4272 - a gap entirely caused by A12's 2026-07-22 Q2 filing, not by
      the price. Re-pricing is not refreshing.</div>`;
  }

  // An empty pane is indistinguishable from a broken one, so it never is - the
  // same rule the sidebar's own filter follows.
  if (!shown.length) {
    h += `<div class="pf-none">Nothing to show. Add an analysis with the box above.</div>`;
  }

  if (ok.length) h += `<div class="scroll"><table><thead><tr>
      <th>Analysis</th><th>Age</th><th>MoS (${LAB[mosAnchor]})</th><th>P(undervalued)</th>
      <th style="width:14%"></th><th>Price</th>
      <th>P10</th><th>P25</th><th>P50</th><th>P90</th><th>Flags</th>
    </tr></thead><tbody>${ok.map(r => {
      const m = r[key];
      const age = ageInfo(r.age_days);
      // The two kinds differ in kind: a floored tail is a meaningless piece of the
      // distribution, a degenerate p_undervalued is the whole number as artefact.
      const flags = [];
      // Rated with the engine's own text: 12 of the 13 shipped specs that floor draws
      // fire on fewer than 5 of 50,000, where a percentage formatted here would read
      // "0.00%" - the disclosure saying the opposite of what it means.
      (r.diagnostics || []).forEach(d => flags.push(
        `<span class="badge warn" title="${esc(d.name)}: fired on ${d.count} of the
          run's draws (${esc(d.rate_text)}). Those draws were floored, not computed,
          so that tail of the distribution is not meaningful.">${
          esc(d.name)} ${d.count} (${esc(d.rate_text)})</span>`));
      if (r.degenerate) flags.push(
        `<span class="badge bad" title="Every draw came out on one side of the price,
          so the reported standard error of 0.0000 is an artefact, not confidence.
          Treat it as a too-narrow-inputs warning, not a result.">p = ${
          fmt(r.p_undervalued)} exactly - artefact, not a result</span>`);
      // The partition: a warning this column cannot draw is still counted rather than
      // silently dropped.
      const declared = (r.diagnostics || []).length + (r.degenerate ? 1 : 0);
      if (r.warnings > declared) flags.push(
        `<span class="badge warn">${r.warnings - declared} more warning(s)</span>`);
      if (repriced && !r.repriced) flags.push(`<span class="badge">no quote</span>`);
      return `<tr class="pf-row" data-open="${esc(r.name)}">
        <td>${esc(r.name)}</td>
        <td class="num ${age?.stale ? "down" : "tag"}" title="analysed ${esc(r.as_of || "?")}">${
          age ? age.text : "-"}${age?.stale ? " stale" : ""}</td>
        <td class="num ${m >= 0 ? "up" : "down"}">${
          typeof m === "number" ? `${m >= 0 ? "+" : ""}${(m * 100).toFixed(1)}%` : "-"}</td>
        <td class="num">${r.p_undervalued.toFixed(4)}</td>
        <td><div class="pf-bar"><i style="width:${(r.p_undervalued * 100).toFixed(1)}%"></i><u></u></div></td>
        <td class="num" title="${r.repriced
          ? `quote ${esc(r.current_as_of || "")}${
              r.current_live ? " (LIVE intraday, still moving)" : " (settled close)"
            }; spec price ${fmt(r.spec_price)}`
