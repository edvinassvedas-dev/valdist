          : "the spec's own price"}">${fmt(r.price)}${
          r.repriced ? (r.current_live ? "\u2020" : "*") : ""}</td>
        <td class="num ${mosAnchor === "p10" ? "" : "tag"}">${fmt(r.value_p10)}</td>
        <td class="num ${mosAnchor === "p25" ? "" : "tag"}">${fmt(r.value_p25)}</td>
        <td class="num ${mosAnchor === "p50" ? "" : "tag"}">${fmt(r.value_p50)}</td>
        <td class="num ${mosAnchor === "p90" ? "" : "tag"}">${fmt(r.value_p90)}</td>
        <td class="tag flags">${flags.join("")}</td>
      </tr>`;
    }).join("")}</tbody></table></div>
    <p class="tagline">Age is days since the analysis date; over ${STALE_DAYS} is
    marked stale, because a saved verdict decays as both the price and the
    fundamentals move. ${repriced ? "A price marked * is a current quote and one "
      + "marked † a live intraday one, neither of them the spec's. " : ""
      }The value column matching the anchor is highlighted; the
    other two are muted. The hairline on each P(undervalued) bar is 0.50. Click a
    row to open it.</p>`;

  if (bad.length) {
    h += `<div class="banner err"><b>${
      count(bad.length, rows.length - okAll - pendingAll)} could not be run</b>${
      bad.map(r => `${esc(r.name)}: ${esc(r.error || r.status)}`).join("<br>")}</div>`;
  }
  return h;
}

function renderCompare(d) {
  const { a, b } = d;
  const num = (x, dp = 2) => (typeof x === "number" && isFinite(x)) ? x.toFixed(dp) : "-";
  const deltaCell = (x, y, dp = 2, pct = false) => {
    if (typeof x !== "number" || typeof y !== "number") return `<td class="tag">-</td>`;
    const dd = y - x;
    const cls = Math.abs(dd) < 1e-9 ? "same" : (dd > 0 ? "up" : "down");
    return `<td class="num ${cls}">${dd >= 0 ? "+" : ""}${
      pct ? (dd * 100).toFixed(1) + "%" : dd.toFixed(dp)}</td>`;
  };

  // Comparison left, current right, so the delta reads "what changed to arrive
  // here". The other order renders a price that fell as "+4.27".
  let h = `<div class="banner ok"><b>${esc(b.name)} &rarr; ${esc(a.name)}</b>
    Each side run at its own spec price and seed. Delta is
    ${esc(a.name)} minus ${esc(b.name)}, i.e. what changed to arrive at the
    analysis you are viewing.</div>`;

  h += `<h3>Results</h3><table class="tornado-t"><thead><tr>
      <th></th><th>${esc(b.name)}</th><th>${esc(a.name)}</th><th>Delta</th>
    </tr></thead><tbody>
    <tr><td>Price</td><td class="num">${num(b.price)}</td><td class="num">${num(a.price)}</td>${deltaCell(b.price, a.price)}</tr>
    <tr><td>P(undervalued)</td><td class="num">${num(b.p_undervalued, 4)}</td><td class="num">${num(a.p_undervalued, 4)}</td>${deltaCell(b.p_undervalued, a.p_undervalued, 4)}</tr>
    ${["p10", "p25", "p50", "p90"].map(k =>
      `<tr><td>Value ${LAB[k]}</td><td class="num">${num(b[`value_${k}`])}</td>
        <td class="num">${num(a[`value_${k}`])}</td>${
        deltaCell(b[`value_${k}`], a[`value_${k}`])}</tr>`).join("")}
    ${["p10", "p25", "p50", "p90"].map(k =>
      `<tr><td>MoS (${LAB[k]})</td><td class="num">${(b[`mos_${k}`] * 100).toFixed(1)}%</td>
        <td class="num">${(a[`mos_${k}`] * 100).toFixed(1)}%</td>${
        deltaCell(b[`mos_${k}`], a[`mos_${k}`], 2, true)}</tr>`).join("")}
    </tbody></table>
    <p class="tagline">The whole range, not an anchor you pick: a diff is a
    question about what moved, and two vintages can agree at the median while
    disagreeing sharply in the tails - which is the movement worth seeing.</p>`;

  // Drivers present on either side; a driver added or dropped is itself news.
  const keys = [...new Set([...Object.keys(a.drivers), ...Object.keys(b.drivers)])].sort();
  h += `<h3>Driver marginals (p10 / p50 / p90)</h3>
    <div class="scroll"><table><thead><tr><th>Driver</th>
      <th>${esc(b.name)}</th><th>${esc(a.name)}</th><th>p50 delta</th></tr></thead><tbody>${
    keys.map(k => {
      const x = b.drivers[k], y = a.drivers[k];
      const band = m => m ? `${m.p10} / ${m.p50} / ${m.p90} <span class="tag">(${esc(m.family)})</span>` : "-";
      // A family change is not visible in a p50 delta but can change the whole
      // sampled tail, so it is called out in its own right.
      const famChanged = x && y && x.family !== y.family;
      return `<tr><td>${esc(k)}</td><td>${band(x)}</td><td>${band(y)}</td>${
        (x && y)
          ? (famChanged
              ? `<td class="num down">family ${esc(x.family)} &rarr; ${esc(y.family)}</td>`
              : deltaCell(x.p50, y.p50))
          : `<td class="tag">${x ? "dropped" : "added"}</td>`}</tr>`;
    }).join("")}</tbody></table></div>`;

  const ck = [...new Set([...Object.keys(a.constants), ...Object.keys(b.constants)])].sort();
  const changed = ck.filter(k => a.constants[k] !== b.constants[k]);
  h += `<h3>Constants that changed</h3>`;
  h += changed.length
    ? `<div class="scroll"><table><thead><tr><th>Constant</th>
        <th>${esc(b.name)}</th><th>${esc(a.name)}</th><th>Delta</th></tr></thead><tbody>${
      changed.map(k => `<tr><td>${esc(k)}</td>
        <td class="num">${esc(String(b.constants[k] ?? "-"))}</td>
        <td class="num">${esc(String(a.constants[k] ?? "-"))}</td>
        ${(typeof b.constants[k] === "number" && typeof a.constants[k] === "number")
          ? deltaCell(b.constants[k], a.constants[k]) : `<td class="tag">-</td>`}</tr>`).join("")
      }</tbody></table></div>`
    : `<p class="tagline">None - every constant is identical.</p>`;
  return h;
}

// One shared axis: value does not depend on price, so every run's band is directly
// comparable whatever each was priced at. Scaling each strip to its own extent
// would draw two different views identically.
// Two P(undervalued) columns: a saved figure moves because the price moved and
// because the view moved. On the three A12 runs that is 22.1 points saved against
// 10.3 at a common price, a 2.15x overstatement.
function renderTimeline(d) {
  const ok = d.runs.filter(r => r.status === "ok");
  const px = v => (typeof v === "number" && isFinite(v)) ? v : null;

  // The shared domain spans every band AND every price mark, so nothing the
  // view draws can fall outside its own axis.
  const pts = [];
  for (const r of ok) {
    pts.push(r.value_p10, r.value_p90);
    if (px(r.spec_price) !== null) pts.push(r.spec_price);
  }
  if (px(d.common_price) !== null) pts.push(d.common_price);
  const min = Math.min(...pts), max = Math.max(...pts);
  const pad = (max - min) * 0.08 || 1;
  const d0 = min - pad, d1 = max + pad;
  const at = v => (((v - d0) / (d1 - d0)) * 100).toFixed(2);

  let h = `<div class="viz-head">${esc(d.ticker)} &ndash; ${ok.length} run${
      ok.length === 1 ? "" : "s"}${ok.length > 1
      ? `, ${esc(ok[0].as_of)} to ${esc(ok[ok.length - 1].as_of)}` : ""}</div>
    <div class="viz-sub">Value per share, every run on <strong>one shared
      axis</strong> &ndash; value does not depend on price, so the bands are
      directly comparable however each run was priced. The arrow on each strip is
      that run's own price.</div>`;

  if (ok.length < 2) {
    h += `<div class="banner warn"><b>Only one run of ${esc(d.ticker)}</b>
      A timeline of one cannot show drift. Run this ticker again on a newer base
      and both will appear here, with the change decomposed into price and view.</div>`;
  }

  h += d.runs.map(r => {
    if (r.status !== "ok") {
      return `<div class="tl-row"><div class="tl-date">${esc(r.as_of || r.name)}</div>
        <div class="tl-nums" style="color:var(--err)">could not run &ndash; ${
          esc(r.error || r.status)}</div></div>`;
    }
    const lo = at(r.value_p10), hi = at(r.value_p90);
    const hasP25 = typeof r.value_p25 === "number" && isFinite(r.value_p25);
    return `<div class="tl-row">
      <div class="tl-date">${esc(r.as_of)}<br><span class="tag">${
        r.age_days === 0 ? "today" : `${r.age_days}d`}</span></div>
      <div class="tl-strip" title="${esc(r.name)}: P10 ${fmt(r.value_p10)} &middot; P50 ${
        fmt(r.value_p50)} &middot; P90 ${fmt(r.value_p90)}">
        <div class="tl-track">
          <div class="tl-band" style="left:${lo}%;width:${(hi - lo).toFixed(2)}%"></div>
          ${hasP25 ? `<div class="tl-p25" style="left:${at(r.value_p25)}%"></div>` : ""}
          <div class="tl-p50" style="left:${at(r.value_p50)}%"></div>
        </div>
        <div class="tl-price" style="left:${at(r.spec_price)}%"
             title="its own price, ${fmt(r.spec_price)}"></div>
      </div>
      <div class="tl-nums">P10 <b>${fmt(r.value_p10)}</b> &middot; P50 <b>${
        fmt(r.value_p50)}</b> &middot; P90 <b>${fmt(r.value_p90)}</b>
        &nbsp;|&nbsp; price ${fmt(r.spec_price)}
        &nbsp;|&nbsp; P(und) <b>${r.p_undervalued.toFixed(4)}</b> saved${
        typeof r.p_undervalued_common === "number"
          ? ` &middot; <b>${r.p_undervalued_common.toFixed(4)}</b> at ${fmt(d.common_price)}`
          : ""}${r.warnings ? ` &nbsp;|&nbsp; ${r.warnings} warning(s)` : ""}</div>
    </div>`;
  }).join("");

  h += `<div class="tl-axis"><span>${fmt(d0)}</span><span>value per share</span>
    <span>${fmt(d1)}</span></div>`;

  // In words: a reader who has to subtract two columns to find that three quarters
  // of the move was price will not do it.
  const both = ok.filter(r => typeof r.p_undervalued_common === "number");
  if (both.length >= 2) {
    const a = both[0], b = both[both.length - 1];
    const saved = (b.p_undervalued - a.p_undervalued) * 100;
    const view = (b.p_undervalued_common - a.p_undervalued_common) * 100;
    const price = saved - view;
    const sg = v => `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(1)}`;
    h += `<div class="banner ${Math.abs(price) > Math.abs(view) ? "whatif" : "ok"}">
      <b>Saved ${sg(saved)} points; the view moved ${sg(view)}</b>
      P(undervalued) as saved went ${a.p_undervalued.toFixed(4)} &rarr;
      ${b.p_undervalued.toFixed(4)}, a swing of <strong>${sg(saved)}</strong> points.
      Run at one common price of ${fmt(d.common_price)} it went
      ${a.p_undervalued_common.toFixed(4)} &rarr; ${b.p_undervalued_common.toFixed(4)},
      <strong>${sg(view)}</strong>. So <strong>${sg(price)}</strong> points came from
      the price moving and ${sg(view)} from the view of the business changing.
      ${Math.abs(price) > Math.abs(view)
        ? `Most of the movement here is <strong>price, not a change of view</strong>.`
        : `Most of the movement here is a genuine <strong>change of view</strong>.`}</div>`;
  }
  return h;
}

// The band the analyst typed, beside the band the engine actually draws. For three
// of the five families those differ and nothing in the YAML says so: `normal` fits
// one sigma, so an asymmetric 1/7/11 is drawn as 2/7/12; `lognormal` misses its
// stated tails by a median 0.044 of its own band, worst 0.253; `pert`/`triangular`
// read p10/p90 as hard bounds, so a typed `p90: 119.6` drew -866.5 on a real spec.
// Printed for every driver, not only above a threshold: `quantile_mismatch` once
// hid a 4.89% tail error under its own line.
function renderMarginals(d) {
  const rows = d.marginals || [];
  let h = `<div class="viz-head">Marginals &ndash; what each driver can be</div>
    <div class="viz-sub">The <strong>stated</strong> band is what the spec says;
      the <strong>realized</strong> band is what the engine draws. Each driver is
      on its own axis (their scales are incompatible), so compare the two bands
      within a row, never widths across rows. Bands are
      <em>specified judgment, never fitted</em>.</div>`;

  if (!rows.length) {
    return h + `<div class="banner ok"><b>No sampled drivers</b>
      Every input to this valuation is supplied as a constant. That is a legal
      spec &ndash; but a spec with nothing sampled produces a point estimate
      wearing a distribution's clothes, so it is worth knowing.</div>`;
  }

  const flagged = rows.filter(r => r.flagged);
  if (flagged.length) {
    h += `<div class="banner warn"><b>${flagged.length} of ${rows.length} bands
      are drawn more than ${(0.10).toFixed(2)} of their own width from the one
      stated</b>${flagged.map(r => esc(r.name)).join(", ")}. Not necessarily an
      error &ndash; for a bounds family it is what the family means &ndash; but
      it is the gap between what was typed and what was sampled, and it is
      invisible in the YAML.</div>`;
  }

  h += rows.map(r => {
    // Per-driver domain, spanning both bands so neither can fall off its row.
    const lo = Math.min(r.p10, r.r10), hi = Math.max(r.p90, r.r90);
    const pad = (hi - lo) * 0.06 || 1;
    const d0 = lo - pad, d1 = hi + pad;
    const at = v => (((v - d0) / (d1 - d0)) * 100).toFixed(2);
    const w = (a, b) => (at(b) - at(a)).toFixed(2);
    const bound = r.tails === "censored";
    return `<div class="mg-row">
      <div class="mg-name">${esc(r.name)}
        <span class="mg-fam">${esc(r.family)}</span>
        <span class="mg-badge" title="${bound
          ? "p10/p90 are read as hard BOUNDS, so the typed numbers are the minimum and maximum - not the 10th and 90th percentiles"
          : "the family defines tails and draws beyond the stated band"
        }">${bound ? "censored" : "extrapolated"}</span></div>
      <div class="mg-track" title="${esc(r.name)}: stated ${fmt(r.p10)} / ${
        fmt(r.p50)} / ${fmt(r.p90)}, realized ${fmt(r.r10)} / ${fmt(r.r50)} / ${fmt(r.r90)}">
        <div class="mg-stated" style="left:${at(r.p10)}%;width:${w(r.p10, r.p90)}%"></div>
        <div class="mg-mid" style="left:${at(r.p50)}%"></div>
        <div class="mg-realized" style="left:${at(r.r10)}%;width:${w(r.r10, r.r90)}%"></div>
        <div class="mg-rmid" style="left:${at(r.r50)}%"></div>
      </div>
      <div class="mg-nums">stated <b>${fmt(r.p10)}</b> / <b>${fmt(r.p50)}</b> / <b>${
        fmt(r.p90)}</b> &nbsp;&middot;&nbsp; realized <b>${fmt(r.r10)}</b> / <b>${
        fmt(r.r50)}</b> / <b>${fmt(r.r90)}</b> &nbsp;&middot;&nbsp;
        drift <span class="${r.flagged ? "mg-drift-hi" : ""}">${
          r.drift.toFixed(3)}</span> of the band${bound
          ? ` &nbsp;&middot;&nbsp; p10/p90 here are BOUNDS, not percentiles`
          : ""}${r.notice ? `<br><span class="mg-drift-hi">notice</span> ${esc(r.notice)}` : ""}</div>
    </div>`;
  }).join("");

  return h;
}

// Loadings are specified by judgment and never fitted - a discipline no code can
// enforce, so review is what enforces it, and until this panel reviewing lambda
// meant reading YAML. It derives nothing: the sums arrive computed from the
// FactorModel that samples, because a viewer that derives is a second engine.
function renderFactors(d) {
  const k = d.factors.length;
  const sgn = v => `${v >= 0 ? "+" : "-"}${Math.abs(v).toFixed(3)}`;

  // Independence is FactorModel([], {}), the limiting case of the one dependence
  // path - not a missing model.
  let h = `<div class="viz-head">&Lambda; &ndash; factor loadings</div>
    <div class="viz-sub">${k
      ? `${k} factor${k > 1 ? "s" : ""} &times; ${d.drivers.length} drivers.`
      : ""} Loadings are <strong>specified judgment, never fitted</strong> from
      market data. Nothing in the test suite can check one, which is
      why this panel exists: it is here to be disagreed with.</div>`;

  if (!k) {
    return h + `<div class="banner ok"><b>No factors &ndash; the drivers are independent</b>
      This spec declares no common factors, which is how independence is
      <em>expressed</em> (<code>FactorModel([], {})</code>), not a model that is
      missing. Every driver carries &psi; = 1: all of its variation is its own,
      and &Sigma; is the identity.</div>`;
  }

  if (d.unloaded_factors.length) {
    h += `<div class="banner warn"><b>${d.unloaded_factors.length} declared factor(s)
      no driver loads on</b>${d.unloaded_factors.map(esc).join(", ")} &ndash; each
      contributes a zero column to &Lambda; and drops out of &Lambda;&Lambda;'
      entirely, so it changes nothing. Not an error, and <code>validate</code>
      does not flag it: this is also exactly what a mis-typed driver key leaves
      behind, and that spec validates clean.</div>`;
  }

  h += `<div class="scroll"><table><thead><tr>
      <th>Driver</th>${d.factors.map(f => `<th>${esc(f)}</th>`).join("")}
      <th title="sum of squared loadings - the share of this driver's variance driven by the common factors">&Sigma;&lambda;&sup2;</th>
      <th title="idiosyncratic standard deviation, sqrt(1 - sum of squared loadings)">&psi;</th>
    </tr></thead><tbody>${d.drivers.map(r => {
      // psi = 0 is legal, the comonotonic limit - but a spec that did not intend it has
      // a driver with no independent variation left.
      const full = r.sum_sq >= 1 - 1e-9;
      return `<tr class="${full ? "lam-row-full" : ""}">
        <td>${esc(r.name)}</td>
        ${r.loadings.map(v => {
          const w = (Math.min(Math.abs(v), 1) * 50).toFixed(2);
          return `<td><div class="lam-cell" title="${esc(r.name)}: ${sgn(v)}">
            <div class="lam-zero"></div>
            ${v === 0 ? `<div class="lam-nil"></div>`
              : `<i class="lam-bar ${v > 0 ? "lam-pos" : "lam-neg"}" style="${
                  v > 0 ? `left:50%` : `left:${(50 - w).toFixed(2)}%`};width:${w}%"></i>`}
            </div><span class="lam-val">${sgn(v)}</span></td>`;
        }).join("")}
        <td class="num">${r.sum_sq.toFixed(3)}</td>
        <td class="num">${r.psi.toFixed(3)}${
          full ? ` <span class="tag">fully committed</span>` : ""}</td>
      </tr>`;
    }).join("")}</tbody></table></div>
    <p class="tagline">A loading is a correlation with a latent factor, so its
    <strong>sign is the economic claim</strong> and its magnitude only says how
    much. &Sigma;&lambda;&sup2; and &psi;&sup2; are two halves of one budget: they
    sum to 1 per driver, so a high &Sigma;&lambda;&sup2; means little of that
    driver moves on its own. A row marked <em>fully committed</em> has &psi; = 0
    &ndash; no independent variation at all, which is the comonotonic limit and
    is almost never what a multi-driver spec intends.</p>`;
  return h;
}

function renderWorlds(rows, marginals) {
  if (!rows || !rows.length) return `<p class="tagline">No worlds returned.</p>`;
  const drivers = Object.keys(rows[0]).filter(k => k !== "quantile" && k !== "value");
  const WORLDS = [
    { q: 0.1, key: "--w10", lab: "P10 world" },
    { q: 0.5, key: "--w50", lab: "P50 world" },
    { q: 0.9, key: "--w90", lab: "P90 world" },
  ];
  const rowFor = q => rows.find(r => Math.abs(r.quantile - q) < 1e-9);

  let h = `<div class="banner ok"><b>Percentile worlds</b>
    The driver values behind the P10, P50 and P90 outcomes. Each driver is drawn
    on its own axis - they are not on a common scale - with the p10 to p90 band
    you specified shown as context. <strong>Each world is a single representative
    draw</strong> (the one nearest that value percentile), not an average, so a
    dot outside the band describes that draw rather than a requirement of the
    outcome.</div>`;

  h += `<div class="wr-legend">${WORLDS.map(w =>
    `<span><i class="wr-key" style="background:var(${w.key})"></i>${
      esc(w.lab)} - value ${fmt(rowFor(w.q)?.value)}</span>`).join("")}</div>`;

  h += drivers.map(name => {
    const m = marginals?.[name];
    const vals = WORLDS.map(w => rowFor(w.q)?.[name]).filter(v => typeof v === "number");
    if (!vals.length) return "";
    // Domain spans the stated band AND every draw, so a draw outside the band
    // stays on screen instead of pinning silently to an edge.
    const pts = m ? vals.concat([m.p10, m.p90]) : vals;
    const lo = Math.min(...pts), hi = Math.max(...pts);
    const pad = (hi - lo) * 0.12 || Math.abs(hi) * 0.1 || 1;
    const d0 = lo - pad, d1 = hi + pad;
    const at = v => ((v - d0) / (d1 - d0)) * 100;
    const outside = m && vals.some(v => v > m.p90 || v < m.p10);

    return `<div class="wr">
      <div class="wr-name">${esc(name)}</div>
      <div class="wr-axis">
        <div class="wr-rule"></div>
        ${m ? `<div class="wr-band" style="left:${at(m.p10)}%;width:${
                at(m.p90) - at(m.p10)}%" title="stated p10 ${m.p10} to p90 ${m.p90}"></div>
              <div class="wr-p50" style="left:${at(m.p50)}%" title="stated p50 ${m.p50}"></div>` : ""}
        ${WORLDS.map(w => {
          const v = rowFor(w.q)?.[name];
          if (typeof v !== "number") return "";
          const beyond = m && (v > m.p90 || v < m.p10);
          return `<div class="wr-dot${beyond ? " out" : ""}" style="left:${
                    at(v)}%;background:var(${w.key})"
                    title="${esc(w.lab)}: ${v.toFixed(2)}${
                      beyond ? " - outside the stated band" : ""}"></div>`;
        }).join("")}
      </div>
      <div class="wr-sub">stated ${m ? `${m.p10} / ${m.p50} / ${m.p90} (${esc(m.family)})` : "band unknown"}
        &nbsp;·&nbsp; worlds ${WORLDS.map(w => {
          const v = rowFor(w.q)?.[name];
          return typeof v === "number" ? v.toFixed(2) : "-";
        }).join(" / ")}${outside ? " · a draw falls outside the stated band" : ""}</div>
    </div>`;
  }).join("");

  // Table-view twin: every value stays reachable without reading a mark.
  const cols = Object.keys(rows[0]);
  h += `<h3>Table</h3><div class="scroll"><table><thead><tr>${
    cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${cols.map(c =>
      `<td class="num">${typeof r[c] === "number" ? fmt(r[c]) : esc(r[c])}</td>`).join("")}</tr>`
    ).join("")}</tbody></table></div>`;
  return h;
}

boot();
</script>
</body>
</html>
